<mat-toolbar class="toolbar">
  <button mat-icon-button class="toolbar__menu" (click)="menuToggle.emit()" aria-label="Toggle menu">
    <mat-icon>menu</mat-icon>
  </button>

  <app-search-bar class="toolbar__search" (searchChange)="onSearch($event)" />

  <span class="toolbar__spacer"></span>

  <button mat-icon-button matTooltip="Refresh" (click)="refresh()">
    <mat-icon>refresh</mat-icon>
  </button>

  <button mat-icon-button matTooltip="Toggle theme" (click)="toggleTheme()">
    <mat-icon>{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>

  <button mat-icon-button [matMenuTriggerFor]="notifMenu" matTooltip="Notifications"
    [matBadge]="unreadCount()" matBadgeColor="warn" [matBadgeHidden]="unreadCount() === 0">
    <mat-icon>notifications</mat-icon>
  </button>
  <mat-menu #notifMenu="matMenu" class="notif-menu">
    <div class="notif-menu__header">
      <span>Notifications</span>
      <button mat-button (click)="markAllRead()">Mark all read</button>
    </div>
    @for (n of notifications(); track n.id) {
      <button mat-menu-item (click)="markRead(n.id)" [class.unread]="!n.read">
        <mat-icon>{{ n.type === 'error' ? 'error' : n.type === 'warning' ? 'warning' : 'info' }}</mat-icon>
        <span>
          <strong>{{ n.title }}</strong>
          <small>{{ n.message }}</small>
        </span>
      </button>
    } @empty {
      <button mat-menu-item disabled>No notifications</button>
    }
  </mat-menu>

  <button mat-button [matMenuTriggerFor]="profileMenu" class="toolbar__profile">
    <span class="toolbar__avatar">{{ user()?.avatar ?? 'U' }}</span>
    <span class="toolbar__name">{{ user()?.name ?? 'User' }}</span>
    <mat-icon>arrow_drop_down</mat-icon>
  </button>
  <mat-menu #profileMenu="matMenu">
    <button mat-menu-item routerLink="/settings">
      <mat-icon>person</mat-icon> Profile
    </button>
    <button mat-menu-item routerLink="/settings">
      <mat-icon>settings</mat-icon> Settings
    </button>
    <button mat-menu-item>
      <mat-icon>logout</mat-icon> Sign Out
    </button>
  </mat-menu>
</mat-toolbar>
